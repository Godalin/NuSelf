[project]
name = "nuself"
version = "0.2.5"
description = "A local AI mirror with private memory, daemonized interaction, and proactive reflection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.3.1",
    "langchain-core>=1.2.21",
    "langchain-openai>=1.1.10",
    "langgraph>=1.1.10",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "prompt-toolkit>=3.0.0",
    "langchain>=1.3.0",
    "openai>=2.26.0",
    "anthropic>=0.84.0",
]

[project.scripts]
nuself = "nuself.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=7.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    "ignore:Importing Send from langgraph.constants is deprecated",
]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
