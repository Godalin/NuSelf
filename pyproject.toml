[project]
name = "nuself"
version = "0.1.0"
description = "A local AI mirror with private memory, daemonized interaction, and proactive reflection."
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1.10",
    "langmem>=0.0.30",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]

[project.scripts]
nuself = "nuself.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=7.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
