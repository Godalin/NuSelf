name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Run uv sync
        run: uv sync --locked --group dev
      - name: Verify release metadata
        run: uv run --locked python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - name: Run locked pyright
        run: uv run --locked pyright --outputjson
      - name: Run full test suite
        run: uv run --locked pytest -q
      - name: Build distributions
        run: uv build
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv /tmp/nuself-wheel-smoke
          /tmp/nuself-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/nuself-wheel-smoke/bin/nuself --version
      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: "dist/*"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}
          files: dist/*
