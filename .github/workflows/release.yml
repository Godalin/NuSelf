name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Run uv sync
        run: uv sync --group dev
      - name: Verify release metadata
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
      - name: Build distributions
        run: uv build
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv /tmp/nuself-wheel-smoke
          /tmp/nuself-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/nuself-wheel-smoke/bin/nuself --version
      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PyPI publication intentionally disabled here. To enable, add a
      # `PYPI_API_TOKEN` secret and restore the following step:
      # - name: Publish to PyPI (optional)
      #   if: secrets.PYPI_API_TOKEN != ''
      #   uses: pypa/gh-action-pypi-publish@v1.5.1
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}
