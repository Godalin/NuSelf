name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main
      - "dev/**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.21
      - name: Run uv sync
        run: uv sync --locked --group dev
      - name: Run locked pyright
        run: uv run --locked pyright --outputjson
      - name: Run tests via uv
        run: uv run --locked pytest -q
      - name: Build distributions
        run: uv build
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv /tmp/nuself-wheel-smoke
          /tmp/nuself-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/nuself-wheel-smoke/bin/python -c "import nuself.cli; import nuself.llm"
          /tmp/nuself-wheel-smoke/bin/nuself --version
