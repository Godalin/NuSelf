name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pyright
      - name: Run pyright
        run: pyright --outputjson
      - name: Run tests
        run: pytest -q
