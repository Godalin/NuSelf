name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main
      - "dev/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Run uv sync
        run: uv sync --group dev
      - name: Run pyright via uvx
        run: uvx pyright --outputjson
      - name: Run tests via uv
        run: uv run pytest -q
      - name: Build distributions
        run: uv build
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv /tmp/nuself-wheel-smoke
          /tmp/nuself-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/nuself-wheel-smoke/bin/python -c "import nuself.cli; import nuself.llm"
