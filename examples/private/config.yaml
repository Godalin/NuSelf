# NuSelf Unified Configuration
# Copy this to private/config.yaml to customize your NuSelf instance.
# All values are optional; missing fields use safe defaults.

# LLM Configuration
llm:
  # OpenAI-compatible API endpoint
  - base_url: https://api.openai.com/v1
    # Leave empty to disable this endpoint. If all endpoints are disabled,
    # chat returns local configuration guidance.
    api_key: ""
    # Model name for completions
    model: gpt-4.1-mini
    # Provider HTTP request timeout
    timeout_seconds: 60
  # Optional Anthropic endpoint
  # - anthropic: true
  #   api_key: ""
  #   model: claude-sonnet-4-5

# Chat Agent Settings
chat:
  # Client-side timeout while waiting for daemon chat responses
  request_timeout_seconds: 120
  context:
    # Recent messages to keep in full context
    recent_messages: 12
    # When to compress context (messages threshold)
    summary_trigger_messages: 18
    # Target size in characters for compressed summary
    summary_target_chars: 2400

# Daemon Background Tasks
daemon:
  memory_curator:
    # Interval in seconds between memory curation cycles
    interval_seconds: 300
  reflection_scheduler:
    # Interval in seconds to check if reflection should run
    check_interval_seconds: 600
  notification_delivery:
    # Interval in seconds to check and deliver pending notifications
    interval_seconds: 30

# Proactive Reflection System
reflection:
  scheduler:
    # Base interval between reflection cycles (seconds, minimum 60)
    interval_seconds: 3600
    # Minimum cooldown after a reflection before attempting another (seconds)
    cooldown_seconds: 300
    # Quiet hours: no reflection between start and end
    # Use 24-hour format. If start > end, wraps around midnight (e.g. 22 to 7 = 22:00-07:00)
    quiet_start_hour: 22
    quiet_end_hour: 7
    # Maximum reflections per day
    daily_cap: 5
    # Random jitter on interval to avoid clustering (0-50%)
    jitter_percent: 20
  gate:
    # Minimum composite score for a candidate to pass relevance gate (0.0-1.0)
    relevance_threshold: 0.5
    # Score threshold to trigger multi-persona discussion (0.0-1.0)
    persona_discussion_threshold: 0.7
  moderator:
    # Maximum rounds in a persona discussion before forcing conclusion
    max_discussion_rounds: 10
    # Rounds to attempt convergence before moderator forces a decision
    moderator_convergence_patience: 5

# Email Notification Adapter (optional)
email:
  enabled: false
  smtp:
    host: smtp.gmail.com
    port: 587
    use_tls: true
    username: ""
    password: ""
  from_address: ""

# macOS Notification Adapter
macos_notification:
  enabled: true

# Experimental Features
experimental:
  vector_index: false

# Example: Fast testing configuration
# daemon:
#   memory_curator:
#     interval_seconds: 10
#   reflection_scheduler:
#     check_interval_seconds: 5
# reflection:
#   scheduler:
